# THE CI CONTRACT — `task ci` is what CI runs and what you run locally.
version: '3'

includes:
  repo:
    taskfile: .taskfiles/repo.yml

vars:
  COVERAGE_FILE: coverage.out

tasks:
  default:
    desc: Run the full check suite (alias for ci)
    cmds:
      - task: ci

  tidy:
    desc: Sync go.mod / go.sum
    cmds:
      - go mod tidy

  manifests:
    desc: Generate CRDs (config/crd/bases) and RBAC (config/rbac/role.yaml) from markers
    cmds:
      - ./hack/regenerate.sh manifests

  generate:
    desc: Generate deepcopy methods from kubebuilder object markers
    cmds:
      - ./hack/regenerate.sh deepcopy

  fmt:
    desc: Fail if any Go file is not gofmt-formatted
    cmds:
      - |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          exit 1
        fi

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  build:
    desc: Compile all packages
    cmds:
      - go build ./...

  test:
    desc: Run tests with the race detector (envtest assets via setup-envtest)
    deps: [repo:chart:deps]
    vars:
      ENVTEST_K8S_VERSION: '1.33.0'
    cmds:
      - |
        export KUBEBUILDER_ASSETS="$(go tool setup-envtest use {{.ENVTEST_K8S_VERSION}} -p path)"
        go test -race ./...

  cover:
    desc: Run tests and print per-function coverage
    cmds:
      - go test ./... -coverprofile={{.COVERAGE_FILE}}
      - go tool cover -func={{.COVERAGE_FILE}}

  generate-helm-rbac:
    desc: Regenerate chart RBAC from config/rbac/role.yaml
    deps: [manifests]
    cmds:
      - ./hack/generate-helm-rbac.sh

  sync-helm-crds:
    desc: Wrap config/crd/bases CRDs into chart templates with install/keep gates
    deps: [manifests]
    cmds:
      - ./hack/sync-helm-crds.sh

  helm-template-test:
    desc: Render-assert the opt-in agent PodMonitor template (issue #36)
    deps: [repo:chart:deps]
    cmds:
      - |
        set -eu
        on=$(helm template chart/ --set observability.metrics.agentPodMonitor.enabled=true)
        echo "$on" | grep -q "kind: PodMonitor"                     || { echo "enabled: PodMonitor not rendered" >&2; exit 1; }
        echo "$on" | grep -q "app.kubernetes.io/name: towonel-agent" || { echo "enabled: agent name selector missing" >&2; exit 1; }
        echo "$on" | grep -q "app.kubernetes.io/part-of: towonel-operator" || { echo "enabled: part-of selector missing" >&2; exit 1; }
        echo "$on" | grep -q "any: true"                            || { echo "enabled: namespaceSelector any:true missing" >&2; exit 1; }
        echo "$on" | grep -q "port: metrics"                        || { echo "enabled: metrics endpoint port missing" >&2; exit 1; }
        off=$(helm template chart/)
        if echo "$off" | grep -q "kind: PodMonitor"; then echo "default: PodMonitor must NOT render when disabled" >&2; exit 1; fi
        echo "helm-template-test OK"

  docker-build:
    desc: Build the operator image (no push)
    cmds:
      - docker build -t towonel-operator:dev .

  verify-generated:
    desc: Fail if generated artifacts are stale (CI drift gate)
    cmds:
      - task: generate
      - task: manifests
      - task: sync-helm-crds
      - task: generate-helm-rbac
      - |
        if ! git diff --quiet -- api/v1alpha1/zz_generated.deepcopy.go config/ chart/templates/crd-*.yaml chart/templates/_values-rbac.tpl; then
          echo "Generated artifacts are stale. Run: task generate manifests sync-helm-crds generate-helm-rbac" >&2
          git --no-pager diff --stat -- api/v1alpha1/zz_generated.deepcopy.go config/ chart/templates/crd-*.yaml chart/templates/_values-rbac.tpl >&2
          exit 1
        fi

  ci:
    desc: Everything CI runs. Run this before pushing.
    cmds:
      - task: lint
      - task: build
      - task: test
      - task: helm-template-test
      - task: verify-generated

  lint:
    desc: Static checks only (repo checks incl. helm lint, gofmt, go vet)
    cmds:
      - task: repo:ci
      - task: fmt
      - task: vet

  # Runs locally: IMAGE=ghcr.io/jacaudi/towonel-operator:sha-abc1234 task smoke
  smoke:
    desc: Assert the image starts and reports its version
    requires:
      vars: [IMAGE]
    env:
      IMAGE: '{{.IMAGE}}'
    cmds:
      - |
        set -eu
        echo "smoke testing ${IMAGE}"
        out=$(docker run --rm "${IMAGE}" --version)
        echo "${out}"
        case "${out}" in towonel-operator\ *) ;; *) echo "::error::unexpected --version output"; exit 1 ;; esac
